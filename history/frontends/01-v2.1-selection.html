<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d1117"><link rel="stylesheet" href="../../web/vendor/xterm.css"><title>Claude TUI</title><style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#c9d1d9;--accent:#7ee787;--muted:#8b949e;--danger:#ff7b72}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#app{height:100%;display:flex;flex-direction:column}#top{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;flex:0 0 auto}.dot{width:7px;height:7px;border-radius:50%;background:#f85149}.dot.ok{background:var(--accent)}#status{color:var(--muted)}#terminal{flex:1;min-height:0;padding:4px 4px 0;touch-action:none}.xterm{height:100%}.xterm-viewport{overscroll-behavior:contain}.quick,.bar2{display:grid;gap:5px;padding:6px;background:var(--panel);border-top:1px solid var(--line);flex:0 0 auto}.quick{grid-template-columns:repeat(8,1fr)}.bar2{grid-template-columns:repeat(6,1fr);padding-top:0}.quick button,.bar2 button,.pcrow button{height:38px;border:1px solid var(--line);border-radius:7px;background:#21262d;color:var(--fg);font:600 12px inherit;padding:0 3px;user-select:none;-webkit-user-select:none}.quick button:active,.bar2 button:active,.pcrow button:active{background:#30363d}.danger{color:var(--danger)!important}.active{border-color:var(--accent)!important;color:var(--accent)!important;background:#17251b!important}#pc{display:none;background:var(--panel);padding:6px;border-top:1px solid var(--line);max-height:48vh;overflow:auto}#pc.show{display:block}.kbd{display:flex;flex-direction:column;gap:5px}.krow{display:flex;gap:4px}.krow button{min-width:0;height:36px;flex:1;border:1px solid var(--line);border-radius:7px;background:#21262d;color:var(--fg);font:600 11px inherit;padding:0 2px;user-select:none;-webkit-user-select:none}.krow button:active{background:#30363d}.krow .u125{flex:1.25}.krow .u15{flex:1.5}.krow .u175{flex:1.75}.krow .u2{flex:2}.krow .u225{flex:2.25}.krow .u275{flex:2.75}.krow .u6{flex:6}.kbdtop{display:flex;gap:4px;margin-bottom:3px}.kbdtop button{height:32px;flex:1;font-size:10px}.navrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:2px}.navrow button{height:34px}.arrowpad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:42%;margin-left:auto}.arrowpad .blank{visibility:hidden}.arrowpad button{height:34px}#ime{position:fixed;left:4px;bottom:4px;width:2px;height:2px;opacity:.01;border:0;padding:0}.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:7px 10px;border-radius:7px;font-size:12px;display:none;z-index:20}.toast.show{display:block}#scrollBadge{position:absolute;right:8px;top:42px;background:#17251b;color:var(--accent);border:1px solid #2ea043;padding:4px 7px;border-radius:6px;font-size:11px;display:none;z-index:5}body.scrollmode #scrollBadge{display:block}
</style></head><body><div id="app"><div id="top"><span id="dot" class="dot"></span><span id="status">connecting…</span><span style="margin-left:auto;color:#8b949e">Claude TUI v2.1</span></div><div id="scrollBadge">历史浏览 · 不会发送输入</div><div id="terminal"></div><div class="quick"><button data-key="esc">Esc</button><button data-key="ctrlc" class="danger">Ctrl+C</button><button data-key="tab">Tab</button><button data-key="enter">Enter</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button></div><div class="bar2"><button id="pcbtn">⌨电脑</button><button id="imebtn">手机键盘</button><button id="copy">复制</button><button id="paste">粘贴</button><button id="scrollbtn">浏览</button><button id="reconnect">重连</button></div><div id="pc"></div></div><textarea id="ime" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><div id="toast" class="toast"></div>
<script src="../../web/vendor/xterm.js"></script><script src="../../web/vendor/addon-fit.js"></script><script>
const term=new Terminal({cursorBlink:true,scrollback:8000,fontSize:12,lineHeight:1.15,fontFamily:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',theme:{background:'#0d1117',foreground:'#c9d1d9',cursor:'#7ee787',selectionBackground:'#264f78'},allowProposedApi:true,disableStdin:true});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();
let ws=null,retry=0,manual=false,pingTimer=null,scrollMode=false,mods={ctrl:false,alt:false,shift:false};const dot=document.getElementById('dot'),status=document.getElementById('status'),ime=document.getElementById('ime'),pc=document.getElementById('pc');
function setStatus(s,ok=false){status.textContent=s;dot.classList.toggle('ok',ok)}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1100)}function blurAll(){try{term.blur()}catch{};try{ime.blur()}catch{};if(document.activeElement instanceof HTMLElement)document.activeElement.blur()}
function url(){return(location.protocol==='https:'?'wss://':'ws://')+location.host+'/mobile/ws'}function sendRaw(s){if(ws&&ws.readyState===1)ws.send(new TextEncoder().encode(s))}function ctl(action){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'tmux',action}))}function resize(){try{fit.fit();if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}))}catch{}}
function connect(){manual=false;setStatus('connecting…');ws=new WebSocket(url());ws.binaryType='arraybuffer';ws.onopen=()=>{retry=0;setStatus('connected',true);resize();clearInterval(pingTimer);pingTimer=setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({type:'ping'}))},15000)};ws.onmessage=e=>{if(typeof e.data==='string'){try{if(JSON.parse(e.data).type==='pong')return}catch{}}else term.write(new Uint8Array(e.data))};ws.onclose=()=>{clearInterval(pingTimer);setStatus('disconnected · reconnecting');if(!manual)setTimeout(connect,Math.min(1000*Math.pow(1.7,retry++),8000))};ws.onerror=()=>setStatus('network error')}
const seq={esc:'\x1b',ctrlc:'\x03',tab:'\t',enter:'\r',up:'\x1b[A',down:'\x1b[B',left:'\x1b[D',right:'\x1b[C',backspace:'\x7f',del:'\x1b[3~',home:'\x1b[H',end:'\x1b[F',pgup:'\x1b[5~',pgdn:'\x1b[6~'};
function sendKey(k){if(scrollMode){if(k==='pgup')ctl('page-up');else if(k==='pgdn')ctl('page-down');else if(k==='up')ctl('scroll-up');else if(k==='down')ctl('scroll-down');return}let s=seq[k]??k;if(s.length===1){let ch=s;if(mods.shift)ch=/[a-z]/.test(ch)?ch.toUpperCase():ch;if(mods.ctrl&&/[a-zA-Z]/.test(ch))ch=String.fromCharCode(ch.toUpperCase().charCodeAt(0)-64);if(mods.alt)ch='\x1b'+ch;s=ch}sendRaw(s);mods={ctrl:false,alt:false,shift:false};renderMods();blurAll()}
function safeButton(b){b.type='button'}document.querySelectorAll('button').forEach(safeButton);document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{b.classList.add('active');setTimeout(()=>b.classList.remove('active'),120);sendKey(b.dataset.key)});
const layout=[
 [{k:'`'},{k:'1'},{k:'2'},{k:'3'},{k:'4'},{k:'5'},{k:'6'},{k:'7'},{k:'8'},{k:'9'},{k:'0'},{k:'-'},{k:'='},{k:'Backspace',c:'u2'}],
 [{k:'Tab',c:'u15'},{k:'q'},{k:'w'},{k:'e'},{k:'r'},{k:'t'},{k:'y'},{k:'u'},{k:'i'},{k:'o'},{k:'p'},{k:'['},{k:']'},{k:'\\',c:'u15'}],
 [{k:'Caps',c:'u175'},{k:'a'},{k:'s'},{k:'d'},{k:'f'},{k:'g'},{k:'h'},{k:'j'},{k:'k'},{k:'l'},{k:';'},{k:"'"},{k:'Enter',c:'u225'}],
 [{k:'Shift',c:'u225'},{k:'z'},{k:'x'},{k:'c'},{k:'v'},{k:'b'},{k:'n'},{k:'m'},{k:','},{k:'.'},{k:'/'},{k:'Shift',c:'u275'}],
 [{k:'Ctrl',c:'u125'},{k:'Win',c:'u125'},{k:'Alt',c:'u125'},{k:'Space',c:'u6'},{k:'Alt',c:'u125'},{k:'Fn',c:'u125'},{k:'Ctrl',c:'u125'}]
];
const topKeys=['Esc','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'];
const navKeys=['Ins','Del','Home','End','PgUp','PgDn'];
const wrap=document.createElement('div');wrap.className='kbd';pc.appendChild(wrap);
const topRow=document.createElement('div');topRow.className='kbdtop krow';topKeys.forEach(k=>topRow.appendChild(makeKey(k)));wrap.appendChild(topRow);
layout.forEach(row=>{const d=document.createElement('div');d.className='krow';row.forEach(o=>d.appendChild(makeKey(o.k,o.c)));wrap.appendChild(d)});
const nav=document.createElement('div');nav.className='navrow krow';navKeys.forEach(k=>nav.appendChild(makeKey(k)));wrap.appendChild(nav);
const arrows=document.createElement('div');arrows.className='arrowpad krow';['','↑','','←','↓','→'].forEach(k=>{if(!k){const x=document.createElement('button');x.className='blank';arrows.appendChild(x)}else arrows.appendChild(makeKey(k))});wrap.appendChild(arrows);
function makeKey(k,c=''){const b=document.createElement('button');b.textContent=k;b.dataset.pc=k;if(c)b.classList.add(c);safeButton(b);b.onclick=()=>pcKey(k);return b}
function renderMods(){pc.querySelectorAll('[data-pc]').forEach(b=>{const q=b.dataset.pc.toLowerCase();b.classList.toggle('active',!!mods[q])})}function pcKey(k){if(['Ctrl','Alt','Shift'].includes(k)){const q=k.toLowerCase();mods[q]=!mods[q];renderMods();blurAll();return}if(k==='Caps'||k==='Win'||k==='Fn'){toast(k+' 暂未映射');return}if(/^F([1-9]|1[0-2])$/.test(k)){const n=Number(k.slice(1));sendRaw('\x1b['+(n<5?10+n: n<11?11+n:24+(n-11))+'~');return}const map={Backspace:'backspace',Ins:'\x1b[2~',Del:'del',Home:'home',End:'end',PgUp:'pgup',PgDn:'pgdn',Esc:'esc',Tab:'tab',Enter:'enter','←':'left','↑':'up','↓':'down','→':'right',Space:' '};const v=map[k]??k;if(typeof v==='string'&&v.startsWith('\x1b[')&&v.endsWith('~'))sendRaw(v);else sendKey(v)}
document.getElementById('pcbtn').onclick=()=>{pc.classList.toggle('show');document.getElementById('pcbtn').classList.toggle('active',pc.classList.contains('show'));blurAll()};document.getElementById('imebtn').onclick=()=>{scrollMode=false;exitScroll();ime.value='';ime.focus();toast('手机键盘已打开')};
ime.addEventListener('input',()=>{if(ime.value){sendRaw(ime.value);ime.value=''}});ime.addEventListener('keydown',e=>{if(e.key==='Backspace'){sendRaw('\x7f');e.preventDefault()}else if(e.key==='Enter'){sendRaw('\r');e.preventDefault()}else if(e.key==='Escape'){sendRaw('\x1b');e.preventDefault()}});
document.getElementById('copy').onclick=async()=>{const s=term.getSelection();blurAll();if(!s)return toast('长按/拖选文字后再复制');try{await navigator.clipboard.writeText(s);toast('已复制')}catch{toast('复制失败')}};document.getElementById('paste').onclick=async()=>{blurAll();try{sendRaw(await navigator.clipboard.readText());toast('已粘贴')}catch{toast('剪贴板权限未开放')}};document.getElementById('reconnect').onclick=()=>{blurAll();manual=true;try{ws.close()}catch{}setTimeout(connect,150)};
function enterScroll(){scrollMode=true;document.body.classList.add('scrollmode');document.getElementById('scrollbtn').classList.add('active');ctl('copy-mode');blurAll()}function exitScroll(){if(!scrollMode&& !document.body.classList.contains('scrollmode'))return;scrollMode=false;document.body.classList.remove('scrollmode');document.getElementById('scrollbtn').classList.remove('active');ctl('cancel-copy');blurAll()}document.getElementById('scrollbtn').onclick=()=>scrollMode?exitScroll():enterScroll();
let sy=0,lastY=0,acc=0;const tel=document.getElementById('terminal');tel.addEventListener('touchstart',e=>{if(!scrollMode)return;sy=lastY=e.touches[0].clientY;acc=0;e.preventDefault()},{passive:false});tel.addEventListener('touchmove',e=>{if(!scrollMode)return;const y=e.touches[0].clientY,dy=y-lastY;acc+=dy;lastY=y;while(Math.abs(acc)>=18){if(acc>0){ctl('scroll-up');acc-=18}else{ctl('scroll-down');acc+=18}}e.preventDefault()},{passive:false});tel.addEventListener('touchend',e=>{if(scrollMode)e.preventDefault()},{passive:false});tel.addEventListener('pointerdown',e=>{if(!scrollMode){e.preventDefault();blurAll()}});
window.addEventListener('resize',()=>setTimeout(resize,120));screen.orientation?.addEventListener?.('change',()=>setTimeout(resize,250));connect();setTimeout(resize,300);
</script></body></html>
