function tapToEdit(x,y){const p=cellAt(x,y),buf=term.buffer.active,current=buf.baseY+buf.cursorY;if(p.row!==current)return false;prepareEdit();const delta=p.col-buf.cursorX;if(delta!==0){const key=delta<0?'left':'right';for(let i=0;i<Math.min(Math.abs(delta),160);i++)sendRaw(seq[key])}ime.value='';try{ime.focus({preventScroll:true})}catch{ime.focus()}return true}
function finishMirrorTouch(e){const mt=mirrorTouch;if(!mt)return;const dur=performance.now()-mt.startT;let x=mt.x,y=mt.lastY;if(e&&e.changedTouches&&e.changedTouches[0]){x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY}mirrorTouch=null;if(!mt.moved&&dur<350)tapToEdit(x,y);if(mirrorDirty)setTimeout(scheduleMirror,24)}
nativeText.addEventListener('touchend',finishMirrorTouch,{passive:true});nativeText.addEventListener('touchcancel',e=>{mirrorTouch=null;if(mirrorDirty)setTimeout(scheduleMirror,24)},{passive:true});
term.onRender(()=>scheduleMirror());term.onScroll(()=>scheduleMirror());
screen.orientation?.addEventListener?.('change',()=>setTimeout(resize,250));connect();syncViewport();setTimeout(()=>{resize();scheduleMirror()},300);
