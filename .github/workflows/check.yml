name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q server.py tests
      - run: python scripts/verify-source.py
      - run: bash -n scripts/create-session.sh
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js && node --check web/i18n.js && node --check tests/browser.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-tui-browser" --no-package-lock --no-save playwright@1.55.0
          "$RUNNER_TEMP/mobile-tui-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise mobile browser and live terminal
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/mobile-tui-browser/node_modules/playwright/index.mjs
        run: python tests/run_browser.py
