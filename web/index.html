<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="app.css">
  <title>Mobile TUI Remote</title>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="dot" class="dot"></span>
      <span id="status" role="status">Connecting…</span>
      <select id="language" data-i18n-label="language" aria-label="Interface language"><option value="auto" data-i18n="auto">Auto</option><option value="en">English</option><option value="zh">中文</option></select>
      <span class="brand">Mobile TUI</span>
    </header>

    <main id="terminal">
      <div id="nativeText" data-i18n-label="selection" aria-label="Terminal text selection layer"></div>
    </main>

    <div class="quickbar">
      <button data-key="esc">Esc</button>
      <button data-key="ctrlc" class="danger">Ctrl+C</button>
      <button data-key="tab">Tab</button>
      <button data-key="enter">Enter</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="left">←</button>
      <button data-key="right">→</button>
    </div>

    <div class="actionbar">
      <button id="pcbtn" data-i18n="keyboard">⌨ PC</button>
      <button id="imebtn" data-i18n="phoneIME">Phone IME</button>
      <button id="copybtn" data-i18n="copy">Copy</button>
      <button id="pastebtn" data-i18n="paste">Paste</button>
      <button id="bottombtn" data-i18n="bottom">Bottom</button>
      <button id="reconnectbtn" data-i18n="reconnect">Reconnect</button>
    </div>

    <section id="pc" data-i18n-label="pcKeyboard" aria-label="PC keyboard"></section>
  </div>

  <textarea id="ime" data-i18n-label="input" aria-label="Terminal input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  <div id="toast" class="toast"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
