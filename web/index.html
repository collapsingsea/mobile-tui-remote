<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d1117"><link rel="stylesheet" href="vendor/xterm.css"><title>Mobile TUI Remote</title><style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#c9d1d9;--accent:#7ee787;--muted:#8b949e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#app{height:100%;display:flex;flex-direction:column}#top{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;flex:0 0 auto}.dot{width:7px;height:7px;border-radius:50%;background:#f85149}.dot.ok{background:var(--accent)}#status{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#terminal{flex:1;min-height:0;padding:4px 4px 0}.xterm{height:100%}.xterm-viewport{overscroll-behavior:contain}.toolbar{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:6px;background:var(--panel);border-top:1px solid var(--line);flex:0 0 auto}.toolbar button,.bar2 button{height:38px;border:1px solid var(--line);border-radius:7px;background:#21262d;color:var(--fg);font:600 12px inherit;padding:0 4px}.toolbar button:active,.bar2 button:active{background:#30363d;transform:translateY(1px)}.toolbar .danger{color:#ff7b72}.bar2{display:flex;gap:6px;padding:0 6px 6px;background:var(--panel);flex:0 0 auto}.bar2 button{flex:1}.bar2 .active{border-color:var(--accent);color:var(--accent)}#ime{position:fixed;left:-1000px;top:-1000px;width:1px;height:1px;opacity:0}.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:7px 10px;border-radius:7px;font-size:12px;display:none;z-index:10}.toast.show{display:block}body.touchpad #terminal{touch-action:none}
</style></head><body><div id="app"><div id="top"><span id="dot" class="dot"></span><span id="status">connecting…</span><span style="margin-left:auto;color:#8b949e">Mobile TUI Remote</span></div><div id="terminal"></div><div class="toolbar">
<button data-key="esc">Esc</button><button data-key="ctrlc" class="danger">Ctrl+C</button><button data-key="tab">Tab</button><button data-key="enter">Enter</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button></div><div class="bar2"><button id="kbd">⌨ 键盘</button><button id="copy">复制</button><button id="paste">粘贴</button><button id="touch">触控板</button><button id="reconnect">重连</button></div></div><textarea id="ime" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><div id="toast" class="toast"></div>
<script src="vendor/xterm.js"></script><script src="vendor/addon-fit.js"></script><script>
const term=new Terminal({cursorBlink:true,convertEol:false,scrollback:6000,fontSize:12,lineHeight:1.15,fontFamily:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',theme:{background:'#0d1117',foreground:'#c9d1d9',cursor:'#7ee787',selectionBackground:'#264f78'},allowProposedApi:true});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();
let ws=null,retry=0,manual=false,touchpad=false,pingTimer=null;const dot=document.getElementById('dot'),status=document.getElementById('status'),ime=document.getElementById('ime');
function setStatus(s,ok=false){status.textContent=s;dot.classList.toggle('ok',ok)}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}
function url(){return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/mobile/ws'}
function send(s){if(ws&&ws.readyState===1)ws.send(new TextEncoder().encode(s))}
function resize(){try{fit.fit();if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}))}catch(e){}}
function connect(){manual=false;setStatus('connecting…');ws=new WebSocket(url());ws.binaryType='arraybuffer';ws.onopen=()=>{retry=0;setStatus('connected',true);resize();clearInterval(pingTimer);pingTimer=setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({type:'ping'}))},15000)};ws.onmessage=e=>{if(typeof e.data==='string'){try{const d=JSON.parse(e.data);if(d.type==='pong')return}catch{}}else term.write(new Uint8Array(e.data))};ws.onclose=()=>{clearInterval(pingTimer);setStatus('disconnected · reconnecting');if(!manual){const d=Math.min(1000*Math.pow(1.7,retry++),8000);setTimeout(connect,d)}};ws.onerror=()=>setStatus('network error')}
term.onData(d=>send(d));window.addEventListener('resize',()=>setTimeout(resize,120));screen.orientation?.addEventListener?.('change',()=>setTimeout(resize,250));
const keySeq={esc:'\x1b',ctrlc:'\x03',tab:'\t',enter:'\r',up:'\x1b[A',down:'\x1b[B',left:'\x1b[D',right:'\x1b[C'};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{send(keySeq[b.dataset.key]||'');term.focus()});
document.getElementById('kbd').onclick=()=>{ime.value='';ime.focus();toast('键盘已打开')};ime.addEventListener('input',()=>{if(ime.value){send(ime.value);ime.value=''}});ime.addEventListener('keydown',e=>{if(e.key==='Backspace'){send('\x7f');e.preventDefault()}else if(e.key==='Enter'){send('\r');e.preventDefault()}else if(e.key==='Escape'){send('\x1b');e.preventDefault()}});
document.getElementById('copy').onclick=async()=>{const s=term.getSelection();if(!s)return toast('先拖选文本');try{await navigator.clipboard.writeText(s);toast('已复制')}catch{toast('复制失败')}};
document.getElementById('paste').onclick=async()=>{try{const s=await navigator.clipboard.readText();send(s);toast('已粘贴')}catch{ime.focus();toast('浏览器未授权剪贴板')}};
document.getElementById('reconnect').onclick=()=>{manual=true;try{ws.close()}catch{}setTimeout(connect,150)};
const touchBtn=document.getElementById('touch');touchBtn.onclick=()=>{touchpad=!touchpad;document.body.classList.toggle('touchpad',touchpad);touchBtn.classList.toggle('active',touchpad);term.options.disableStdin=false;toast(touchpad?'触控板模式':'文本选择模式')};
let sx=0,sy=0,lx=0,ly=0,drag=false;const el=document.getElementById('terminal');el.addEventListener('touchstart',e=>{if(!touchpad)return;const t=e.touches[0];sx=lx=t.clientX;sy=ly=t.clientY;drag=false;e.preventDefault()},{passive:false});el.addEventListener('touchmove',e=>{if(!touchpad)return;const t=e.touches[0],dx=t.clientX-lx,dy=t.clientY-ly;if(Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy)>8)drag=true;let seq='';if(Math.abs(dx)>16){seq+=dx>0?'\x1b[C':'\x1b[D';lx=t.clientX}if(Math.abs(dy)>16){seq+=dy>0?'\x1b[B':'\x1b[A';ly=t.clientY}if(seq)send(seq);e.preventDefault()},{passive:false});el.addEventListener('touchend',e=>{if(!touchpad)return;if(!drag)send('\r');e.preventDefault()},{passive:false});
connect();setTimeout(resize,300);
</script></body></html>
